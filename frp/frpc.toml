# FRP 客户端配置示例（FRP 0.61.2+）
# 真实运行配置由 server/src/frp-client.js 根据 server/.env 生成到 server/frp/frpc.toml。

serverAddr = "your-server-ip-or-domain"
serverPort = 7000

[auth]
token = "your-frp-token-here"

[[proxies]]
name = "tarotora"
type = "tcp"
localIP = "127.0.0.1"
localPort = 3000
remotePort = 53000
